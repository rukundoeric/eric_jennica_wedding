<style>
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;height:100%;background:#fbf2e4;overflow:hidden}
  #site{position:fixed;inset:0;width:100%;height:100%;border:0;opacity:0;visibility:hidden;transition:opacity .7s;background:#fbf2e4}
  .shown #site{opacity:1;visibility:visible}
  .bg{position:fixed;inset:0;background:url("02_details/floral-frame-background.webp") center/cover no-repeat}
  .stage{--u:calc(min(100vw,100vh * 954 / 981) / 954);position:absolute;left:50%;top:50%;
         width:calc(954*var(--u));height:calc(981*var(--u));transform:translate(-50%,-50%)}
  .title{position:absolute;left:0;right:0;top:calc(197*var(--u));text-align:center;
         font-family:'Licorice',cursive;font-size:calc(80*var(--u));line-height:calc(112*var(--u));color:#dba94e}
  .date{position:absolute;left:0;right:0;top:calc(331*var(--u));text-align:center;
        font-family:'Old Standard TT',serif;font-size:calc(26.67*var(--u));letter-spacing:calc(5.33*var(--u));color:#dba94e}
  .env{position:absolute;left:calc(90*var(--u));top:calc(295*var(--u));width:calc(773*var(--u));cursor:pointer;
       transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .9s;filter:drop-shadow(0 calc(10*var(--u)) calc(14*var(--u)) rgba(150,100,20,.18))}
  .env:hover{transform:scale(1.02)}
  .tap{position:absolute;left:0;right:0;top:calc(756*var(--u));text-align:center;
       font-family:'Old Standard TT',serif;font-size:calc(17.5*var(--u));letter-spacing:calc(3*var(--u));color:#dba94e;
       animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  .auto{position:absolute;left:0;right:0;top:calc(800*var(--u));text-align:center;
        font-family:'Old Standard TT',serif;font-size:calc(15*var(--u));letter-spacing:calc(2*var(--u));color:#b8954f}
  .open .env{transform:scale(1.25) translateY(-4%);opacity:0}
  .open .title,.open .date,.open .tap,.open .auto{transition:opacity .6s;opacity:0}
</style>
</head>
<body>
<audio id="song" src="music/wedding-song.mp3" loop preload="auto" playsinline></audio>
<div class="bg"></div>
<div class="stage" id="stage">
  <div class="title">You are invited!</div>
  <div class="date">DECEMBER 19, 2026</div>
  <img class="env" src="00_envelope-page/envelope.webp" alt="Sunflower envelope – tap to open the invitation" id="env">
  <div class="tap">TAP ENVELOPE TO OPEN INVITATION</div>
  <div class="auto" id="auto">Opening automatically in <span id="secs">30</span>s</div>
</div>
<iframe id="site" src="home.html?v=950a32c8" title="Eric &amp; Jennica Wedding Invitation"></iframe>
<script>
  window.WeddingMusic={audio:document.getElementById('song'),userPaused:false};
  var opened=false, left=30, secs=document.getElementById('secs');
  function openInvite(){
    if(opened) return; opened=true; clearInterval(timer);
    document.getElementById('stage').classList.add('open');
    // start the song now (works because the guest just tapped); the page below keeps it playing
    window.WeddingMusic.opened=true;
    if(!window.WeddingMusic.userPaused){ var p=window.WeddingMusic.audio.play(); if(p&&p.catch) p.catch(function(){}); }
    setTimeout(function(){
      document.body.classList.add('shown');
      if(window.WeddingMusic.onShown) window.WeddingMusic.onShown();
      try{ document.title=document.getElementById('site').contentDocument.title||document.title; }catch(e){}
    },850);
  }
  document.getElementById('env').addEventListener('click',openInvite);
  var timer=setInterval(function(){
    left--; secs.textContent=left;
    if(left<=0) openInvite();
  },1000);
</script>
</body>
